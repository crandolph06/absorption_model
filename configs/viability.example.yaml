run:
  name: viability_smoke
  random_seed: 42
  output_dir: outputs/viability
  workers: 1

model:
  years_to_run: 20
  start_year: 2026
  assessment_start_year: 2040
  target_year: 2040
  brain_path: outputs/single_phase/brains/hpc_sortie_brain_multi_output_mlp.pkl
  expected_brain_outputs: 16
  round_robin: true
  use_upgrade_quotas: true
  staff_priority_mode: random
  n_replications: 1

requirements:
  target_total_pilots: 3500
  target_line_pilots: null
  min_experience_ratio: null
  allowed_wg_rap_shortfall: 0.0
  allowed_fl_rap_shortfall: 0.0
  allowed_ip_rap_shortfall: 0.0
  target_staff_ips: null
  target_staff_fls: null

constraint_scales:
  total_pilots: 100.0
  line_pilots: 100.0
  wg_rap: 1.0
  fl_rap: 1.0
  ip_rap: 1.0
  staff_ips: 10.0
  staff_fls: 10.0
  experience_ratio: 0.05

policy:
  parameterization: constant
  variables:
    annual_intake:
      type: int
      low: 10
      high: 350
    retention_rate:
      type: float
      low: 0.10
      high: 0.65
    ute:
      type: float
      low: 6
      high: 20
    paa:
      type: int
      low: 18
      high: 30
    max_manning_pct:
      type: float
      low: 100
      high: 200
    flug_quota_per_phase:
      type: int
      low: 0
      high: 10
    ipug_quota_per_phase:
      type: int
      low: 0
      high: 10

doe:
  method: sobol
  n_initial: 128
  start_index: 0
  scramble: true
  include_corners: true
  include_baselines: true
  include_corners_on_resume: false
  include_baselines_on_resume: false
  baselines:
    - annual_intake: 250
      retention_rate: 0.5
      ute: 12
      paa: 24
      max_manning_pct: 150
      flug_quota_per_phase: 3
      ipug_quota_per_phase: 2
